<!DOCTYPE html><html lang="en" class="lock"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ahmed &amp; Habiba · Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1e9de;--ink:#2e2a26;--soft:#6d645b;--gold:#a8864f;--blush:#e6c9bd;--sage:#8a9a80;--card:#fbf7f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;font-size:19px;line-height:1.5;text-align:center;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
html.lock,body.lock{height:100svh;overflow:hidden}
.script{font-family:'Pinyon Script','Snell Roundhand',cursive;font-weight:400}
.ar{font-family:'Amiri','Traditional Arabic',serif;direction:rtl;line-height:2}
canvas#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
section{min-height:100svh;padding:12vh 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;position:relative}
.wrap{max-width:460px;width:100%;position:relative;z-index:1}
/* intro */
#intro{position:fixed;inset:0;z-index:50;overflow:hidden;background:radial-gradient(120% 80% at 50% 0,#fbf3ea,var(--bg) 60%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:transform 1.3s cubic-bezier(.7,0,.2,1),opacity 1s;padding:24px}
#intro.open{transform:translateY(-100%);opacity:.2;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(46px);opacity:.75;animation:drift 12s ease-in-out infinite alternate}
.o1{width:62vmax;height:62vmax;background:#f0cfc3;top:-24vmax;left:-22vmax}.o2{width:50vmax;height:50vmax;background:#c9d4bf;bottom:-20vmax;right:-18vmax;animation-delay:-4s}.o3{width:30vmax;height:30vmax;background:#ecd6a6;top:38%;left:55%;opacity:.5;animation-delay:-8s}
@keyframes drift{to{transform:translate(7vmax,5vmax) scale(1.12)}}
.arch{position:absolute;left:50%;top:50%;width:min(92vw,400px);height:min(88vh,640px);transform:translate(-50%,-50%);fill:none;stroke:var(--gold);stroke-width:1;overflow:visible}
.arch path{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3.2s .2s ease forwards}
.arch .in{animation-delay:.6s;opacity:.55}
@keyframes draw{to{stroke-dashoffset:0}}
.bl{position:absolute;width:150px;fill:#f3d9cf;opacity:.95;pointer-events:none;mix-blend-mode:multiply}
.bl.a{top:-10px;left:-34px;transform:rotate(-20deg);animation:sway 7s ease-in-out infinite}.bl.b{bottom:-14px;right:-30px;transform:rotate(160deg);animation:sway 8s ease-in-out infinite reverse}
.sp{position:absolute;width:12px;height:12px;background:var(--gold);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw 2.6s ease-in-out infinite}
@keyframes tw{50%{transform:scale(.2) rotate(90deg);opacity:.2}}
.iz{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.inv{font-size:.9em;letter-spacing:.32em;color:var(--soft);text-transform:none}
.iz .nm{font-size:clamp(46px,15vw,66px);color:var(--ink);line-height:1.05}
.iz .nm i{color:var(--gold);font-style:normal}
.env{position:relative;width:min(74vw,310px);aspect-ratio:1.4;margin:50px 0 36px;cursor:pointer;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 28px 28px rgba(90,55,35,.28))}
.env>*{position:absolute}
.back{inset:0;background:linear-gradient(160deg,#ecd8cc,#dcbfae);border-radius:8px}
.card{left:7%;right:7%;top:7%;bottom:7%;background:linear-gradient(#fffdf8,#f7efe2);border-radius:5px;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform 1s cubic-bezier(.3,.8,.2,1) .45s;color:var(--ink);box-shadow:0 0 0 1px rgba(168,134,79,.35) inset;outline:5px solid #fffdf8;outline-offset:-9px}
.card b{font-family:'Pinyon Script',cursive;font-weight:400;font-size:38px;line-height:1.1;color:var(--gold)}.card small{font-size:12px;letter-spacing:.2em}
.pocket{inset:0;z-index:2;background:linear-gradient(160deg,#f4e4d8,#e6cdbf);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);border-radius:8px}
.flap{left:0;right:0;top:0;height:56%;z-index:3;background:linear-gradient(#efdcd0,#dfc3b4);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s}
.sw{left:50%;top:55%;width:70px;height:70px;transform:translate(-50%,-50%);z-index:4;transition:.5s}
.seal{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d6b377,#8f6d37);display:grid;place-items:center;color:#fff7e6;font-size:24px;box-shadow:0 6px 14px rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.18)}
.seal:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--gold);animation:ping 2.2s infinite}
.ring{position:absolute;inset:-34px;width:calc(100% + 68px);height:calc(100% + 68px);animation:spin 22s linear infinite;fill:var(--gold);font-size:10.5px;letter-spacing:.14em}
@keyframes spin{to{transform:rotate(360deg)}}
.env.go .flap{transform:rotateX(180deg);z-index:0}.env.go .sw{transform:translate(-50%,-50%) scale(0);opacity:0}.env.go .card{transform:translateY(-62%)}
.hint{font-style:italic;color:var(--soft);letter-spacing:.04em}
.idate{font-size:.95em;letter-spacing:.22em;color:var(--gold)}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes ping{to{transform:scale(1.5);opacity:0}}
/* hero */
.blossom{position:absolute;top:0;right:-6vw;z-index:0;width:min(46vw,210px);opacity:.55;pointer-events:none;mix-blend-mode:multiply;animation:sway 7s ease-in-out infinite;transform-origin:top right}
@keyframes sway{50%{transform:rotate(2.5deg)}}
h1.script{font-size:clamp(54px,17vw,84px);line-height:1;margin:6px 0}
.names{font-size:clamp(32px,10vw,44px);letter-spacing:.14em;font-weight:500}
.sub{color:var(--soft);font-size:.9em;letter-spacing:.06em}
.couple{width:min(86vw,400px);mix-blend-mode:multiply;margin-top:6px;-webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}
/* hero reveal (single orchestrated moment) */
.hero .r{opacity:0;transform:translateY(18px);filter:blur(6px)}
body.in .hero .r{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i)*.22s + .3s)}
@keyframes rise{to{opacity:1;transform:none;filter:none}}
.scroll{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:22px;height:36px;border:1.5px solid var(--gold);border-radius:12px}
.scroll:after{content:"";position:absolute;left:50%;top:7px;width:3px;height:7px;margin-left:-1.5px;background:var(--gold);border-radius:2px;animation:dot 1.6s infinite}
@keyframes dot{60%{transform:translateY(12px);opacity:0}}
/* details */
.date{font-size:clamp(34px,10vw,46px);line-height:1.15;font-weight:500}
.rule{width:64px;height:1px;background:var(--gold);margin:6px auto;position:relative}
.rule:after{content:"♥";position:absolute;left:50%;top:-11px;transform:translateX(-50%);background:var(--bg);color:var(--gold);padding:0 8px;font-size:12px}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:400px;margin-top:14px}
.count div{background:var(--card);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:50% 50% 14px 14px/38% 38% 14px 14px;padding:16px 4px 10px}
.count b{display:block;font-size:34px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:.72em;color:var(--soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 26px;border-radius:999px;border:1px solid var(--gold);background:transparent;color:var(--ink);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;transition:.3s;position:relative;overflow:hidden}
.btn.fill{background:var(--gold);color:#fff}
.btn:active{transform:scale(.96)}.btn:focus-visible,.env:focus-visible{outline:3px solid var(--sage);outline-offset:3px}
.btn:hover{background:var(--gold);color:#fff}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
/* venue */
.venue{background:var(--card);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:200px 200px 22px 22px;padding:64px 26px 30px;width:100%;max-width:420px;box-shadow:0 24px 50px -30px rgba(80,50,30,.5)}
.venue h2{font-size:clamp(34px,10vw,44px);font-weight:500;line-height:1.1}
.venue p{color:var(--soft)}
.venue .hall{color:var(--gold);font-style:italic;font-size:1.25em;margin:6px 0 18px}
.msg{font-size:clamp(26px,7.4vw,34px);font-style:italic;line-height:1.3}
.foot{font-size:.8em;color:var(--soft);margin-top:20px}
/* reveal on scroll */
.rv{opacity:0;transform:translateY(24px);transition:1s cubic-bezier(.2,.7,.2,1)}.rv.on{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.hero .r,.rv{opacity:1;transform:none;filter:none}}
@media (min-width:900px){body{font-size:21px}}

  start:"2026-10-21T19:00:00", end:"2026-10-21T23:00:00", // venue local time
  venue:"Al-Amirat Palace",
  address:"Al-Tayaran St., 7th District, Nasr City",
  hall:"Cinderella Hall",
  mapsLat:30.0516889, mapsLng:31.3258202, // exact venue pin
  mapsLink:"https://maps.app.goo.gl/X3D8TzHALqpcj1Pe6", // shows the place page

  message:"If this invitation reached you, know that you are very special to us.",
  rsvpWhatsApp:"" // e.g. "201001234567" to show an RSVP button; leave empty to hide
};
/* Personal greeting: add ?to=Guest%20Name to the link */
/* ================================================================ */
const $=s=>document.querySelector(s),C=CONFIG;
document.querySelectorAll('[data-k]').forEach(e=>e.textContent=C[e.dataset.k]);
$('#names').textContent=C.names.join(' & ');
$('#dDate').textContent=C.dateText;$('#dTime').textContent=C.timeText;
$('#vName').textContent=C.venue;$('#vAddr').innerHTML=C.address.replace(/, /,',<br>');$('#vHall').textContent=C.hall;
$('#map').href='https://www.google.com/maps/dir/?api=1&travelmode=driving&destination='+C.mapsLat+','+C.mapsLng;
$('#place').href=C.mapsLink;
$('#sign').textContent=C.names.map(n=>n[0]+n.slice(1).toLowerCase()).join(' & ');
const guest=new URLSearchParams(location.search).get('to');
const nm=C.names.map(n=>n[0]+n.slice(1).toLowerCase());
$('#introNm').innerHTML=(guest?'<span style="font-size:.5em;display:block;color:var(--soft)">Dear '+guest.replace(/</g,'')+'</span>':'')+nm[0]+' <i>&amp;</i> '+nm[1];
$('#cardMono').textContent=nm.map(n=>n[0]).join(' & ');$('#cardDate').textContent='21 · 10 · 2026';
$('#introDate').textContent=C.dateText.replace(/^\w+, /,'').toUpperCase();
$('#ringTxt').textContent=(C.names.join(' & ')+' ✦ 21 · 10 · 2026 ✦ ').repeat(1);
if(C.rsvpWhatsApp){$('#rsvpRow').innerHTML='<a class="btn" target="_blank" rel="noopener" href="https://wa.me/'+C.rsvpWhatsApp+'?text='+encodeURIComponent("I'll be there! "+(guest||''))+'">Confirm on WhatsApp</a>'}
if(navigator.share)$('#share').innerHTML='<button class="btn" id="sh">Share invitation</button>',$('#sh').onclick=()=>navigator.share({title:document.title,url:location.href}).catch(()=>{});
/* countdown (treats the date as local time of the viewer) */
const target=new Date(C.start).getTime(),box=$('#count');
box.innerHTML=['Days','Hours','Minutes','Seconds'].map(l=>'<div><b>0</b><span>'+l+'</span></div>').join('');
function tick(){let d=Math.max(0,target-Date.now()),v=[86400000,3600000,60000,1000].map(u=>{const x=Math.floor(d/u);d-=x*u;return x});
box.querySelectorAll('b').forEach((b,i)=>b.textContent=String(v[i]).padStart(2,'0'))}
tick();setInterval(tick,1000);
/* calendar file */
$('#ics').onclick=()=>{const f=s=>s.replace(/[-:]/g,'');
const t='BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:Wedding of '+C.names.join(' & ')+'\nDTSTART:'+f(C.start)+'\nDTEND:'+f(C.end)+'\nLOCATION:'+C.venue+'\\, '+C.hall+'\\, '+C.address.replace(/,/g,'\\,')+'\nEND:VEVENT\nEND:VCALENDAR';
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/calendar'}));a.download='wedding.ics';a.click()};
/* open envelope */
if('scrollRestoration'in history)history.scrollRestoration='manual';
const jump=()=>{const h=document.documentElement;h.style.scrollBehavior='auto';scrollTo(0,0);h.style.scrollBehavior=''};jump();
const env=$('#env');
function openInv(){if(env.classList.contains('go'))return;env.classList.add('go');env.blur();burst();
setTimeout(()=>{$('#intro').classList.add('open');document.documentElement.classList.remove('lock');document.body.classList.remove('lock');document.body.classList.add('in');jump()},750);setTimeout(jump,1400);
setTimeout(()=>$('#intro').remove(),2400)}
env.onclick=openInv;env.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openInv()}};
/* scroll reveal */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}}),{threshold:.25});
document.querySelectorAll('.rv').forEach(e=>io.observe(e));
/* petals: light canvas, paused when hidden */
const cv=$('#petals'),cx=cv.getContext('2d');let W,H,P=[],run=true;
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function size(){const r=devicePixelRatio>1?2:1;W=cv.width=innerWidth*r;H=cv.height=innerHeight*r;cx.setTransform(r,0,0,r,0,0)}
addEventListener('resize',size);size();
const cols=['#f1d3c8','#f7e4dc','#e9c1b2','#d9b97c'];
function mk(x,y,b){return{x:x??Math.random()*innerWidth,y:y??-20,s:5+Math.random()*7,vy:(b?-1:.4)*(.6+Math.random())*(b?4:1),vx:(Math.random()-.5)*(b?7:.8),r:Math.random()*6,vr:(Math.random()-.5)*.06,c:cols[Math.random()*4|0],ph:Math.random()*9}}
function burst(){if(reduce)return;for(let i=0;i<46;i++)P.push(mk(innerWidth/2,innerHeight/2,1))}
if(!reduce)for(let i=0;i<14;i++)P.push(mk(null,Math.random()*innerHeight));
function frame(){if(!run)return;cx.clearRect(0,0,innerWidth,innerHeight);
P.forEach((p,i)=>{p.vy+=p.vy<0?.12:0;p.x+=p.vx+Math.sin(p.ph+=.02)*.5;p.y+=p.vy;p.r+=p.vr;
cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=.8;cx.beginPath();cx.ellipse(0,0,p.s,p.s*.55,0,0,7);cx.fill();cx.restore();
if(p.y>innerHeight+20){if(P.length>16)P.splice(i,1);else Object.assign(p,mk())}});requestAnimationFrame(frame)}
if(!reduce)frame();
document.addEventListener('visibilitychange',()=>{run=!document.hidden;if(run&&!reduce)frame()});
</script></body></html>
